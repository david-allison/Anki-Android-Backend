import com.android.build.gradle.tasks.BundleAar

import java.util.zip.ZipFile

plugins {
    alias(libs.plugins.android.library) // required for aar generation to link to from AnkiDroid
    id 'signing'
    alias(libs.plugins.gradle.maven.publish.plugin)
}

apply from: "$rootDir/build-rust.gradle"
preBuild.dependsOn "buildRust"

/**
 * Replacement for AGP's BuildConfig (buildFeatures.buildConfig): generates
 * net.ankiweb.rsdroid.BuildConfig with the same FQN and fields, so consumers
 * (e.g. AnkiDroid's `import net.ankiweb.rsdroid.BuildConfig as BackendBuildConfig`)
 * need no changes, and the class survives a future move off com.android.library.
 *
 * The output must NOT live in build/generated/source/backend:
 * rslib-bridge/proto.rs deletes that whole directory when regenerating.
 */
abstract class GenerateBuildConfigTask extends DefaultTask {
    @Input
    abstract Property<String> getAnkiCommitHash()

    @Input
    abstract Property<String> getAnkiDesktopVersion()

    @Input
    abstract Property<String> getBackendGitCommitHash()

    @InputFile
    abstract RegularFileProperty getCargoLock()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @TaskAction
    void generate() {
        // the compiled fsrs version is resolved by the root Cargo.lock, not anki/Cargo.lock:
        // rslib-bridge consumes anki as a path dependency, whose lockfile cargo ignores
        //  name = "fsrs"
        //  version = "A.B.C"
        def lockText = cargoLock.get().asFile.getText("UTF-8")
        def matcher = lockText =~ /(?m)^name = "fsrs"\r?\nversion = "([^"]+)"/
        if (!matcher.find()) {
            throw new GradleException("Could not find the fsrs version in Cargo.lock")
        }
        def fsrsVersion = matcher.group(1)
        logger.lifecycle("BuildConfig: anki=${ankiCommitHash.get().take(8)} fsrs=${fsrsVersion}")

        def outFile = outputDir.file("net/ankiweb/rsdroid/BuildConfig.kt").get().asFile
        outFile.parentFile.mkdirs()
        outFile.setText(
            """// Generated by the generateBuildConfig task. DO NOT EDIT.
package net.ankiweb.rsdroid

object BuildConfig {
    const val ANKI_COMMIT_HASH: String = "${ankiCommitHash.get()}"
    const val ANKI_DESKTOP_VERSION: String = "${ankiDesktopVersion.get()}"
    const val FSRS_VERSION: String = "$fsrsVersion"
    const val BACKEND_GIT_COMMIT_HASH: String = "${backendGitCommitHash.get()}"

    /** When the values above last changed (the task is skipped when up to date) */
    const val BACKEND_BUILD_TIME: Long = ${System.currentTimeMillis()}L
}
""",
            "UTF-8",
        )
    }
}

def generateBuildConfig = tasks.register("generateBuildConfig", GenerateBuildConfigTask) {
    // providers.exec is lazy: git only runs when the task is scheduled, and the
    // values participate in the task's up-to-date check
    ankiCommitHash = providers.exec {
        commandLine "git", "-C", new File(rootDir, "anki").absolutePath, "rev-parse", "HEAD"
    }.standardOutput.asText.map { it.trim() }
    backendGitCommitHash = providers.exec {
        commandLine "git", "-C", rootDir.absolutePath, "rev-parse", "HEAD"
    }.standardOutput.asText.map { it.trim() }
    ankiDesktopVersion = providers.gradleProperty("VERSION_NAME")
        .map { it.substring(it.indexOf("anki") + "anki".length()) }
    cargoLock = rootProject.file("Cargo.lock")
    outputDir = layout.buildDirectory.dir("generated/buildconfig")
}
preBuild.dependsOn(generateBuildConfig)

// the sources jar does not run through preBuild, so wire it up separately
tasks.withType(Jar).configureEach { jarTask ->
    if (jarTask.name.toLowerCase().contains("sources")) {
        jarTask.dependsOn(generateBuildConfig)
    }
}

// ktlint scans the source-set directories (then skips build/ files), which
// Gradle validates as reading generateBuildConfig's output: order them, without
// making a lone `ktlintCheck` invocation generate code it will not lint
tasks.matching { it.name.startsWith("runKtlintCheckOver") || it.name.startsWith("runKtlintFormatOver") }.configureEach {
    it.mustRunAfter(generateBuildConfig)
}

android {
    namespace = 'net.ankiweb.rsdroid'
    compileSdk = libs.versions.compileSdk.get().toInteger()
    ndkVersion = libs.versions.ndk.get()

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        targetSdk = libs.versions.targetSdk.get().toInteger()
    }

    lint {
        targetSdk = libs.versions.targetSdk.get().toInteger()
    }

    sourceSets {
        main {
            kotlin.srcDirs += "build/generated/source/backend"
            java.srcDirs += "build/generated/source/backend"
            // replacement for AGP's BuildConfig: see generateBuildConfig above
            kotlin.srcDirs += "build/generated/buildconfig"
            java.srcDirs += "build/generated/buildconfig"
            jniLibs.srcDirs 'build/generated/jniLibs'
            resources {
                srcDirs "src/main/resources"
            }
            assets {
                srcDirs "build/generated/anki_artifacts"
            }
        }
    }
}

afterEvaluate {
    // only the publishable AARs: AGP 9's bundle<Variant>LocalLintAar tasks omit jniLibs
    tasks.withType(BundleAar).matching { it.name ==~ /bundle(Debug|Release)Aar/ }.configureEach { bundleAarTask ->
        bundleAarTask.doLast {
            def aarFile = bundleAarTask.outputs.files.singleFile
            def zipFile = new ZipFile(aarFile)
            int libCount = zipFile.entries().toList().count { it.name.contains(".so") }
            if (libCount == 0 || (System.getenv("ALL_ARCHS") == "1" && libCount != 4)) {
                throw new GradleException("AAR appears to be missing shared library!")
            }
        }
    }
}

dependencies {
    // Protobuf is part of the ABI, so include it as a compile/api dependency.
    api libs.protobuf.kotlin.lite

    implementation libs.androidx.annotation
    implementation libs.androidx.sqlite.ktx
    implementation libs.androidx.sqlite.framework
    implementation libs.kotlinx.serialization.json
    implementation libs.slf4j.api

    testImplementation libs.junit.jupiter
    testImplementation libs.robolectric
    testImplementation libs.androidx.core
    testImplementation libs.androidx.test.junit
    testImplementation project(path: ':rsdroid-testing')
}


// Install Git pre-commit hook for format-rust
tasks.register('installGitHook', Copy) {
    from new File(rootProject.rootDir, 'pre-commit')
    into { new File(rootProject.rootDir, '.git/hooks') }
    filePermissions {
        user {
            read = write = execute = true
        }
    }
}
// to run manually: `./gradlew installGitHook`
tasks.named('preBuild').configure { dependsOn('installGitHook') }

mavenPublishing {
    // Use https://central.sonatype.com/account with david-allison's GitHub login, not Google
    // the host should match rsdroid-testing
    publishToMavenCentral(true) // "true" means publish+release automatically+unattended
    signAllPublications()
}
