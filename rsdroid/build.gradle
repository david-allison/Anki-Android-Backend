plugins {
    alias(libs.plugins.android.library) // required for aar generation to link to from AnkiDroid
    id 'signing'
    alias(libs.plugins.gradle.maven.publish.plugin)
}

apply from: "$rootDir/build-rust.gradle"
preBuild.dependsOn "buildRust"

def gitHead = { File repo ->
    providers.exec {
        commandLine "git", "-C", repo.absolutePath, "rev-parse", "HEAD"
    }.standardOutput.asText.map { it.trim() }
}

// Generate BuildConfig
androidComponents {
    onVariants(selector().all()) { variant ->
        def generateBuildConfig = tasks.register("generate${variant.name.capitalize()}BuildConfig", GenerateBuildConfigTask) {
            ankiCommitHash = gitHead(new File(rootDir, "anki"))
            backendGitCommitHash = gitHead(rootDir)
            ankiDesktopVersion = providers.gradleProperty("VERSION_NAME").map { it.replaceFirst(/.*anki/, "") }
            cargoLock = rootProject.file("Cargo.lock")
        }
        variant.sources.kotlin.addGeneratedSourceDirectory(generateBuildConfig) { it.outputDir }
    }
}

android {
    namespace = 'net.ankiweb.rsdroid'
    compileSdk = libs.versions.compileSdk.get().toInteger()
    ndkVersion = libs.versions.ndk.get()

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    defaultConfig {
        minSdk = libs.versions.minSdk.get().toInteger()

        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    testOptions {
        targetSdk = libs.versions.targetSdk.get().toInteger()
        // JUnit 5; becomes a plain `test { useJUnitPlatform() }` once this module
        // leaves the Android plugin
        unitTests.all {
            it.useJUnitPlatform()
        }
    }

    lint {
        targetSdk = libs.versions.targetSdk.get().toInteger()
    }

    sourceSets {
        main {
            kotlin.srcDirs += "build/generated/source/backend"
            java.srcDirs += "build/generated/source/backend"
        }
    }
}

dependencies {
    // Protobuf is part of the ABI, so include it as a compile/api dependency.
    api libs.protobuf.kotlin.lite
    // JsonArray is returned by the public fullQuery API.
    api libs.kotlinx.serialization.json

    implementation libs.androidx.annotation
    implementation libs.slf4j.api

    testImplementation libs.junit.jupiter
    testImplementation project(path: ':rsdroid-testing')
    testRuntimeOnly libs.junit.platform.launcher
}


mavenPublishing {
    // Use https://central.sonatype.com/account with david-allison's GitHub login, not Google
    // the host should match rsdroid-testing
    publishToMavenCentral(true) // "true" means publish+release automatically+unattended
    signAllPublications()
}
